<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beamline viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<style>
  :root { --panel-bg: rgba(255,255,255,0.92); --panel-fg: #222; --muted: #666; --border: #ccc; }
  :root[data-theme="dark"] { --panel-bg: rgba(30,30,34,0.92); --panel-fg: #eee; --muted: #aaa; --border: #555; }
  html, body { margin: 0; height: 100%; background: #ddd; font: 13px/1.35 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 8px; left: 8px; z-index: 2; background: var(--panel-bg); color: var(--panel-fg);
           border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; max-width: min(340px, calc(100vw - 32px)); }
  #panel.hidden > :not(.head) { display: none; }
  #panel .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  #panel label { display: block; margin-top: 6px; color: var(--muted); }
  #panel select, #panel input[type=file] { width: 100%; box-sizing: border-box; }
  #panel select[multiple] { height: 6.5em; }
  #status { margin-top: 6px; color: var(--muted); white-space: pre-wrap; font-size: 12px; }
  #inspect { position: absolute; right: 8px; bottom: 28px; z-index: 2; max-height: 40vh; overflow: auto; max-width: min(360px, calc(100vw - 32px));
             background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
             font: 11px/1.3 ui-monospace, monospace; white-space: pre; display: none; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div class="head"><span>Beamline viewer</span><button id="toggle" title="hide/show">&#8211;</button></div>
  <label>Packs (Ctrl+click for several)<select id="packs" multiple></select></label>
  <label>Several packs as
    <select id="order">
      <option value="interleaved">one source per pack, layers interleaved</option>
      <option value="grouped">one source per pack, layers grouped</option>
    </select></label>
  <label>Style <select id="variant"><option value="day">day</option><option value="night">night</option></select></label>
  <label>Or open a .pmtiles file <input id="file" type="file" accept=".pmtiles"></label>
  <label><input id="tiles" type="checkbox"> tile boundaries</label>
  <label><input id="inspectOn" type="checkbox"> click to inspect features</label>
  <div id="status"></div>
</div>
<div id="inspect"></div>
<script src="vendor/pmtiles/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
