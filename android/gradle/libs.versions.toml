# Every version the Android build uses. Checked 2026-11-15 against Google Maven, Maven Central,
# the Gradle plugin portal and services.gradle.org. Reasons: docs/experiments/05-android-skeleton.md
[versions]
# Android SDK levels (SDK packages: tools/fetch_android_sdk.py)
android-compileSdk = "37"   # current AndroidX (core 1.19, Compose 1.12, lifecycle 2.11) refuses anything lower
android-targetSdk = "36"     # Google Play: new apps and updates must target 36 since 2026-08-31
android-minSdk = "26"        # valhalla-mobile needs 24; 26 gives java.nio.file + java.time without desugaring
android-buildTools = "36.0.0"
java = "17"                  # bytecode target for app and libraries (JDK running Gradle: gradle/gradle-daemon-jvm.properties)

agp = "9.5.1"                # needs Gradle >= 9.6.0, JDK >= 17, max API 37
kotlin = "2.4.21"            # AGP 9.5 bundles KGP 2.2.10; the plugins below raise it to this version
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
maplibre = "13.7.1"          # org.maplibre.gl:android-sdk (Vulkan) and android-sdk-opengl (the one the app ships)
kotlinxSerialization = "1.13.0"
kotlinxCoroutines = "1.11.0"
junit = "6.1.3"
# Settings plugin: Gradle cannot read the catalog in settings.gradle.kts, so this entry is the
# record and settings.gradle.kts repeats the number. Keep both equal.
foojayResolver = "1.0.0"

# Next step, not used yet (see docs/experiments/05-android-skeleton.md, "Next step"):
#   valhallaMobile = "0.6.4"    io.github.rallista:valhalla-mobile

# Routing track (r2b-routing): docs/experiments/09-routing-on-device.md
valhallaMobile = "0.6.4"     # io.github.rallista:valhalla-mobile, bundles Valhalla 3.9.1 (= the tiles' version)
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
junit4 = "4.13.2"            # instrumentation tests (androidx.test runs JUnit 4)

# Feature round, Round 0 (docs/architecture.md 5.2). Checked 2026-11-15 at Google Maven
# (maven-metadata.xml and the POM's Last-Modified date): each is the newest stable release and
# older than two weeks. Compose test and tooling artifacts take their versions from composeBom.
coreSplashscreen = "1.2.0"   # androidx.core:core-splashscreen, published 2025-11-05 (1.2.0 is the newest stable)
androidxTestRules = "1.7.0"  # androidx.test:rules (GrantPermissionRule), same release train as runner/core

# Round G0, track G (docs/architecture-downloads.md 9.3).
openinghoursparser = "0.29.0"  # ch.poole:OpeningHoursParser (MIT); batch B, :core:search reads OSM opening_hours (rule S10), published 2025-11-23
okhttp = "5.3.2"             # com.squareup.okhttp3:okhttp; over MapLibre's 4.12.0 (Ferrostar, which brought 5.3.2 first, was dropped 2026-11-17), published 2025-11-18

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# One renderer per build, chosen with beamline.mapRenderer in gradle.properties.
maplibre-android-vulkan = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
maplibre-android-opengl = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Routing track (r2b-routing)
valhalla-mobile = { module = "io.github.rallista:valhalla-mobile", version.ref = "valhallaMobile" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

# Feature round, Round 0 (docs/architecture.md 5.2)
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }

# Batch B (2026-11-18): the opening_hours parser of :core:search (rule S10)
opening-hours-parser = { module = "ch.poole:OpeningHoursParser", version.ref = "openinghoursparser" }

# Round G0, track G (docs/architecture-downloads.md 9.3): PackHttp in :core:download
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Track r2b-search (search on the device). Appended as sub-tables so the lines above stay
# untouched (valid TOML: a table's sub-table may be declared after other tables).
# androidx.sqlite 2.7.1: Google Maven metadata checked 2026-11-15 (2.7.1 newest stable; 2.8.0-alpha03
# newest overall). sqlite-bundled compiles SQLite into the app (FTS5, R*Tree) and has a JVM variant
# with natives for Windows/Linux/macOS, so the search tests run on the plain JVM with the same SQLite.
[libraries.androidx-sqlite-bundled]
module = "androidx.sqlite:sqlite-bundled"
version = "2.7.1"
