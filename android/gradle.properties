# Identity of the app: application id and launcher label. Change them here only.
# (The pack folder on a device follows the application id: Android/data/<id>/files/packs/.)
beamline.applicationId=io.github.spysyweeb.beamline
beamline.appName=Beamline

# MapLibre renderer: opengl (org.maplibre.gl:android-sdk-opengl), the owner's choice of 2026-11-16:
# MapLibre's Vulkan build (android-sdk) links glslang, whose GPL-3.0 part (Bison exception) the
# licence gate refuses (decision 6.34), and on the owner's phone OpenGL drew the zoomed-out view
# faster (report 11). vulkan stays selectable for a measurement only (-Pbeamline.mapRenderer=vulkan),
# never for a build that ships.
beamline.mapRenderer=opengl

# Resource caps: this machine is shared with heavy map-data builds.
# Gradle daemon heap 2 GB, at most 4 workers, and Kotlin compiles inside the Gradle daemon
# (no separate Kotlin daemon with its own heap).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
