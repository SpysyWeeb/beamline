<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-40 -40 80 80">
  <!-- Position marker piece 'puck_stale' for Beamline, from the approved sketch docs/design/position-markers.html (path data and colours of its script). Units: sketch units, 1 unit = 0.8 dp; (0,0) = the anchor (the vehicle position), at the centre of the canvas; the piece points up (north / heading 0). MIT License. See assets/markers/SPEC.md. -->
  <defs><filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter><filter id="wide" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter></defs>
  <circle r="30" fill="#8D96A0" fill-opacity=".14"/>
  <circle cy="3" r="16" fill="#000000" fill-opacity=".3" filter="url(#soft)"/>
  <circle r="14" fill="#8D96A0" stroke="#FFFFFF" stroke-width="5"/>
</svg>
